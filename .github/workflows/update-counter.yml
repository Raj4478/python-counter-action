name: Update counter

on:
  schedule:
    # Run once daily at 09:00 IST (03:30 UTC).
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-counter
  cancel-in-progress: false

jobs:
  update-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create a random number of commits
        env:
          COMMIT_AUTHOR_NAME: ${{ github.repository_owner }}
          COMMIT_AUTHOR_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
        run: |
          git config user.name "$COMMIT_AUTHOR_NAME"
          git config user.email "$COMMIT_AUTHOR_EMAIL"

          commit_count=$((RANDOM % 6 + 1))
          echo "Creating $commit_count counter commits today."

          for commit_number in $(seq 1 "$commit_count"); do
            python counter.py
            git add counter.txt
            git commit -m "chore: update counter ($commit_number/$commit_count)"
          done

          git push
