name: Update counter

on:
  schedule:
    # 09:00 and 21:00 IST (UTC+05:30)
    - cron: "30 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-counter
  cancel-in-progress: false

jobs:
  update-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Increment counter
        run: python counter.py

      - name: Commit updated counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          if git diff --cached --quiet; then
            echo "No counter change to commit."
            exit 0
          fi
          git commit -m "chore: update counter"
          git push
